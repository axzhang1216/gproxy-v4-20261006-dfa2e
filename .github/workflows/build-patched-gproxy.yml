name: Build patched GProxy serverless

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/build-patched-gproxy.yml

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 4b446bdcf781b5c871300bef4c019f36becfdb93
  PATCH_TAG: gproxy-v4.1.0-cachefix

jobs:
  console:
    name: Console bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LeenHawk/gproxy
          ref: 4b446bdcf781b5c871300bef4c019f36becfdb93
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm --dir console install --frozen-lockfile
      - run: pnpm --dir console build
        env:
          GPROXY_BUILD_HASH: 4b446bdcf781b5c871300bef4c019f36becfdb93-cachefix
      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: console/dist
          include-hidden-files: true
          retention-days: 1

  serverless:
    name: Serverless (${{ matrix.arch }})
    needs: console
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      ARTIFACT_NAME: gproxy-serverless-linux-${{ matrix.arch }}-musl
      GPROXY_BUILD_HASH: 4b446bdcf781b5c871300bef4c019f36becfdb93-cachefix
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LeenHawk/gproxy
          ref: 4b446bdcf781b5c871300bef4c019f36becfdb93
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: crates/gproxy-host-axum/assets/web
      - name: Patch PostgreSQL cache conflict expressions
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/gproxy-store/src/cache.rs")
          text = path.read_text()

          replacements = {
              "let expired = cache_entry::Column::ExpiresAtMs.lte(now);": """let expired = Expr::col((
                              cache_entry::Entity,
                              cache_entry::Column::ExpiresAtMs,
                          ))
                          .lte(now);""",
              ".finally(Expr::col(cache_entry::Column::Value))": ".finally(Expr::col((cache_entry::Entity, cache_entry::Column::Value)))",
              ".finally(Expr::col(cache_entry::Column::Version))": ".finally(Expr::col((cache_entry::Entity, cache_entry::Column::Version)))",
              ".finally(Expr::col(cache_entry::Column::ExpiresAtMs))": ".finally(Expr::col((cache_entry::Entity, cache_entry::Column::ExpiresAtMs)))",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
      - name: Show and validate patch
        run: |
          git diff --check
          git diff -- crates/gproxy-store/src/cache.rs
      - name: Build patched serverless binary
        run: bash scripts/build-serverless.sh "$TARGET_TRIPLE"
      - name: Smoke test binary
        run: target/${{ matrix.target }}/release/gproxy-serverless --version
      - name: Package binary
        run: |
          mkdir -p dist/release
          zip -j "dist/release/${ARTIFACT_NAME}.zip" "target/${TARGET_TRIPLE}/release/gproxy-serverless"
      - uses: actions/upload-artifact@v4
        with:
          name: serverless-${{ matrix.arch }}
          path: dist/release/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish patched binaries
    needs: serverless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: serverless-*
          path: dist/release
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist/release
          sha256sum gproxy-serverless-linux-*-musl.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$PATCH_TAG" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create "$PATCH_TAG" dist/release/*.zip dist/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "GProxy v4.1.0 PostgreSQL cache fix" \
            --notes "Patched from upstream v4.1.0 (${UPSTREAM_COMMIT}). Qualifies cache_entries columns in the PostgreSQL ON CONFLICT path to avoid SQLSTATE 42702 (column reference value is ambiguous)."
