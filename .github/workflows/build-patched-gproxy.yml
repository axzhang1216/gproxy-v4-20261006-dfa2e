name: Build patched GProxy serverless

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream GProxy v4.1.0
        run: |
          git clone https://github.com/LeenHawk/gproxy.git upstream
          cd upstream
          git checkout 4b446bdcf781b5c871300bef4c019f36becfdb93

      - name: Build console assets
        run: |
          cd upstream
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --dir console install --frozen-lockfile
          GPROXY_BUILD_HASH=4b446bdcf781b5c871300bef4c019f36becfdb93-cachefix pnpm --dir console build

      - name: Patch PostgreSQL cache conflict expressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('upstream/crates/gproxy-store/src/cache.rs')
          text = path.read_text()
          replacements = {
              'let expired = cache_entry::Column::ExpiresAtMs.lte(now);': '''let expired = Expr::col((
                              cache_entry::Entity,
                              cache_entry::Column::ExpiresAtMs,
                          ))
                          .lte(now);''',
              '.finally(Expr::col(cache_entry::Column::Value))': '.finally(Expr::col((cache_entry::Entity, cache_entry::Column::Value)))',
              '.finally(Expr::col(cache_entry::Column::Version))': '.finally(Expr::col((cache_entry::Entity, cache_entry::Column::Version)))',
              '.finally(Expr::col(cache_entry::Column::ExpiresAtMs))': '.finally(Expr::col((cache_entry::Entity, cache_entry::Column::ExpiresAtMs)))',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cd upstream
          git diff --check
          git diff -- crates/gproxy-store/src/cache.rs

      - name: Build patched x86_64 serverless binary
        run: |
          cd upstream
          export GPROXY_BUILD_HASH=4b446bdcf781b5c871300bef4c019f36becfdb93-cachefix
          bash scripts/build-serverless.sh x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/gproxy-serverless --version

      - name: Package patched binary
        run: |
          mkdir -p dist
          zip -j dist/gproxy-serverless-linux-x86_64-musl.zip upstream/target/x86_64-unknown-linux-musl/release/gproxy-serverless
          cd dist
          sha256sum gproxy-serverless-linux-x86_64-musl.zip > SHA256SUMS

      - name: Publish patched release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gproxy-v4.1.0-cachefix --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create gproxy-v4.1.0-cachefix dist/gproxy-serverless-linux-x86_64-musl.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "GProxy v4.1.0 PostgreSQL cache fix" \
            --notes "Patched from upstream v4.1.0 (4b446bdcf781b5c871300bef4c019f36becfdb93). Qualifies cache_entries columns in the PostgreSQL ON CONFLICT path to avoid SQLSTATE 42702: column reference value is ambiguous."
